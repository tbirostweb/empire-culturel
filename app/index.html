<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2440" />
    <title>Empire Culturel — collectionne les monuments du monde</title>
    <meta name="description" content="Empire Culturel : un jeu de collection de monuments du monde en 3D. Ta progression reste sur ton appareil." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Empire Culturel" />
    <meta property="og:description" content="Collectionne les monuments du monde en 3D et bâtis ton empire culturel." />
    <meta property="og:locale" content="fr_FR" />
    <meta name="application-name" content="Empire Culturel" />
    <!-- URL canonique / og:url : À COMPLÉTER avec le domaine de production (inconnu du dépôt). -->

    <!-- PWA : installable depuis un navigateur, ajoutable à l'écran
         d'accueil (Android/Chrome via le manifest, iOS/Safari via les
         balises apple-* ci-dessous — support historiquement plus limité). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Empire Culturel" />

    <!-- Polices (Barlow, Barlow Condensed, IBM Plex Mono) auto-hébergées via @fontsource, importées dans src/main.js. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
