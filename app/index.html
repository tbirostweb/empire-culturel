<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2440" />
    <title>Jeu de Cartes</title>

    <!-- PWA : installable depuis un navigateur, ajoutable à l'écran
         d'accueil (Android/Chrome via le manifest, iOS/Safari via les
         balises apple-* ci-dessous — support historiquement plus limité). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jeu de Cartes" />

    <!-- Identité "plan d'architecte" : Barlow Condensed (titres — grotesque
         condensé technique, façon cartouche de plan), Barlow (corps, même
         famille pour la cohérence), IBM Plex Mono (chiffres/cotes/libellés
         techniques — les nombres d'un relevé sont toujours en chasse fixe).
         Mêmes hôtes Google Fonts que les paires précédentes, donc la CSP de
         app/nginx.conf (fonts.googleapis.com/fonts.gstatic.com) n'a pas
         besoin d'être modifiée. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
