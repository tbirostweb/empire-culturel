server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 'unsafe-inline' sur style-src uniquement : Vue utilise des bindings
    # :style (attribut style="..." inline) un peu partout (barres de
    # progression, safe-area, bandeaux héros). Aucun script inline dans le
    # build Vite — script-src reste strict. App 100% client-only (pas de
    # backend) : connect-src reste 'self'.
    #
    # img-src reste 'self'/data: uniquement (LOT 2 du brief "10/10" :
    # images.unsplash.com retiré, les photos de carte ont été remplacées
    # par des emblèmes SVG générés côté client, `data/cardEmblems.js` +
    # `CardEmblem.vue`, plus aucune image externe chargée par l'app). Si
    # une future image externe est réintroduite, il faudra ré-ajouter son
    # host ici ET vérifier derrière le vrai nginx (pas seulement
    # `vite dev`, qui n'envoie aucun header CSP) — piège déjà rencontré une
    # fois avec les bandeaux héros Unsplash.
    #
    # Polices auto-hébergées (@fontsource, copiées dans /assets au build) :
    # style-src/font-src restent 'self' — plus aucune requête vers Google.
    #
    # Dupliqués dans le bloc location ci-dessous : dès qu'un bloc location
    # définit son propre add_header, nginx cesse d'hériter ceux du bloc
    # server parent pour ce bloc (vérifié : sans ça, les assets .js/.css
    # perdent tous les headers de sécurité).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA en historique hash : seules `/` et `/index.html` sont des pages. Tout
    # autre chemin inconnu renvoie un vrai 404 (au lieu d'un 200 + index.html).
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fichiers non hashés (modèles 3D, manifest, icônes) : revalidation à chaque
    # fois (ETag), jamais `immutable`. Seuls /assets/* (noms hashés par Vite)
    # sont mis en cache longtemps.
    location ~* ^/(?:models/|manifest\.json$|icon-|apple-touch-icon) {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    # location = /sw.js doit rester avant/indépendant du bloc regex
    # ci-dessous : en nginx, un match exact (=) est toujours prioritaire
    # sur un match regex (~*), peu importe l'ordre dans le fichier — mais
    # sans ce bloc dédié, /sw.js tombe dans la regex \.js$ ci-dessous et
    # hérite du cache 30j "immutable" prévu pour les bundles hashés. Bug
    # réel rencontré : le navigateur ne revérifiait alors plus jamais
    # sw.js pendant un mois, donc un nouveau design déployé restait
    # invisible pour un visiteur déjà passé sur le site, indéfiniment.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    location ~* ^/assets/.+\.(?:css|js|svg|png|jpg|jpeg|gif|woff2?|glb)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}
